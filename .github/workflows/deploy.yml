# OPTIONAL and manual. You normally do not need this file: if you used the "Deploy to Cloudflare" button, Cloudflare itself builds
# and deploys your repository on every push (Workers Builds), running `npm run deploy` (which is just `wrangler deploy`: the Worker creates
# its own database tables on the first request, there is no migration step).
# Use this workflow only if you set the project up with scripts/setup.mjs or by hand and prefer GitHub Actions to deploy:
# in the repository open Actions > Deploy > Run workflow. It needs two repository secrets (Settings > Secrets and variables >
# Actions > New repository secret):
#   CLOUDFLARE_API_TOKEN   an API token with the permissions "Workers Scripts: Edit" and "D1: Edit" (Cloudflare dashboard >
#                          My Profile > API Tokens > Create Token)
#   CLOUDFLARE_ACCOUNT_ID  your account id (Cloudflare dashboard > Workers & Pages, right-hand column)
# The D1 database must already exist and its database_id must be in wrangler.jsonc (scripts/setup.mjs writes it: commit the file).
# Passwords and the e-mail key are NOT part of this: they stay in Cloudflare as secrets, set once with
# `npx wrangler secret put NAME`, and every deployment keeps them.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:generic
      # The generic suite again, against YOUR site.config.js.
      - run: node scripts/test.mjs site.config.js --suite test-generic
      - name: Check that wrangler.jsonc has the database id
        run: |
          grep -q '"database_id"' wrangler.jsonc || { echo "wrangler.jsonc has no database_id. Run scripts/setup.mjs and commit wrangler.jsonc"; exit 1; }
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
